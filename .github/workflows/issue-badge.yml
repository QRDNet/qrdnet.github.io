name: Issue QRDNet Credential

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  issue:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install cryptography

      - name: Generate Credential
        env:
          QRDNET_PRIVATE_KEY: ${{ secrets.QRDNET_PRIVATE_KEY }}
        run: |
          # Itt generálhatsz egyedi QRDNet ID-t is dinamikusan
          QRDN_ID="QRDN-ID-$(date +%Y)-$(openssl rand -hex 3 | tr '[:lower:]' '[:upper:']')"
          
          # Szkript meghívása a te kódoddal
          python scripts/issue_credential.py \
            "${{ github.event.pull_request.user.login }}" \
            "noreply@qrdnet.github.io" \
            "researcher" \
            "$QRDN_ID" \
            "$QRDNET_PRIVATE_KEY"

      - name: Commit and push generated credential
        run: |
          git config --global user.name "QRDNet Bot"
          git config --global user.email "bot@qrdnet.github.io"
          git add registry/credentials/*.json
          git commit -m "Auto-issued credential for $QRDN_ID"
          git push